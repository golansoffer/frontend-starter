version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tanstack:
        patterns: ['@tanstack/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*']
    ignore:
      # TS compiler API/plugin peers require this major; Oxlint's Go engine uses TS 7 semantics.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # jest-dom's declarations conflict with the next Vitest major under skipLibCheck: false.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
